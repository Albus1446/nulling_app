[theme]
base = "light"
primaryColor = "#4EA4EF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#DAE2ED"
textColor = "#141521"
font = "Cormorant Garamond, Noto Serif CJK SC, serif"
headingFont = "Cormorant Garamond, Noto Serif CJK SC, serif"
headingFontSizes = ["2.3rem", "1.8rem", "1.4rem"]

[[theme.fontFaces]]
family = "Cormorant Garamond"
url = "app/static/fonts/cormorant-garamond.woff2"
weight = "300 700"
style = "normal"

[[theme.fontFaces]]
family = "Cormorant Garamond"
url = "app/static/fonts/cormorant-garamond-italic.woff2"
weight = "300 700"
style = "italic"

[[theme.fontFaces]]
family = "Noto Serif CJK SC"
url = "app/static/fonts/noto-serif-cjk-sc.woff2"
weight = "400"
style = "normal"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false
